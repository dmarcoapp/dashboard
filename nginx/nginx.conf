server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Runtime configuration, regenerated on every container start
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # The entry point must not be cached: its asset references change with
    # every build, so a stale copy asks for files that are no longer there. The
    # SPA fallback below reaches it through an internal redirect, which is
    # matched here as well.
    location = /index.html {
        expires -1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
