# Deployment workflow for the DMARCo project's own server.
#
# This is not part of installing DMARCo, and it is not something you need to
# fork or copy. To run DMARCo yourself, use the ready-made stack and installer
# in https://github.com/dmarcoapp/dmarcoapp instead.
#
# The workflow only runs on demand (workflow_dispatch) and expects DEPLOY_HOST,
# DEPLOY_USER, DEPLOY_PATH and SSH_PRIVATE_KEY to be set as repository secrets.

name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync files
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "Deploying to production server..."
          rsync -avzqR \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'node_modules' \
            --delete ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Run docker compose on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p 22 "$DEPLOY_USER@$DEPLOY_HOST" << EOF
            set -euo pipefail
            cd "$DEPLOY_PATH"
            docker compose -f compose.yaml -f compose.prod.yaml --env-file .env pull --ignore-buildable
            docker compose -f compose.yaml -f compose.prod.yaml --env-file .env build
            docker compose -f compose.yaml -f compose.prod.yaml --env-file .env up -d --remove-orphans
          EOF
