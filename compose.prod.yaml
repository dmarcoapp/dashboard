services:
  app:
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DISABLE_REGISTRATION: ${VITE_DISABLE_REGISTRATION:-false}
        VITE_MOCK_MODE: ${VITE_MOCK_MODE:-true}
    ports:
      - "127.0.0.1:8081:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
